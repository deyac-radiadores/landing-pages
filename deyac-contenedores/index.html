<script defer>
  // Función para cargar un componente en un contenedor por ID
  async function loadComponent(id, file) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
      console.log(`✅ ${file} cargado correctamente en #${id}`);
    } catch (err) {
      console.error(`❌ Error cargando ${file} en #${id}:`, err);
    }
  }

  // Función para cargar múltiples componentes en un mismo contenedor
  async function loadMultipleComponents(containerId, files) {
    const container = document.getElementById(containerId);
    for (const file of files) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();
        container.insertAdjacentHTML('beforeend', html);
        console.log(`✅ ${file} insertado en #${containerId}`);
      } catch (err) {
        console.error(`❌ Error cargando ${file} en #${containerId}:`, err);
      }
    }
  }

  // Carga secuencial en el orden visual real
  (async () => {
    await loadComponent('header-container', '/components/headerContenedores.html');
    await loadComponent('distribuidor', '/components/distribuidor.html');
    await loadComponent('lideraMercado', '/components/lideraMercado.html');
    await loadComponent('negocioLejos', '/components/negocioLejos.html');
    await loadComponent('gamaCompleta', '/components/gamaCompleta.html');
    await loadComponent('adaptadoNecesidades', '/components/adaptadoNecesidades.html');
    await loadComponent('respuestasTitulo', '/components/respuestasTitulo.html');
    await loadComponent('faqs', '/components/faqs.html');
    await loadComponent('footer-container', '/components/footerContenedores.html');
  })();
</script>
