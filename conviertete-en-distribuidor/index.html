<script defer>
  // Función para cargar un componente en un contenedor por ID
  async function loadComponent(id, file) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
      console.log(`✅ ${file} cargado correctamente en #${id}`);
    } catch (err) {
      console.error(`❌ Error cargando ${file} en #${id}:`, err);
    }
  }

  // Función para cargar múltiples componentes en un mismo contenedor
  async function loadMultipleComponents(containerId, files) {
    const container = document.getElementById(containerId);
    for (const file of files) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();
        container.insertAdjacentHTML('beforeend', html);
        console.log(`✅ ${file} insertado en #${containerId}`);
      } catch (err) {
        console.error(`❌ Error cargando ${file} en #${containerId}:`, err);
      }
    }
  }

  // Carga prioritaria en orden secuencial
  (async () => {
    await loadComponent('header-container', '/components/headerDistribuidores.html');
    await loadComponent('distribuidorOficial', '/components/distribuidorOficial.html');

    // Resto de componentes cargados en paralelo (no críticos)
    loadComponent('exclusivos', '/components/exclusivos.html');
    loadComponent('beneficiosDistribuidor', '/components/beneficiosDistribuidor.html');
    loadComponent('video', '/components/video.html');
    loadComponent('porqueElegirnos', '/components/porqueElegirnos.html');
    loadComponent('nuevosProductos', '/components/nuevosProductos.html');
    loadComponent('footer-container', '/components/footerDistribuidores.html');
  })();
</script>
